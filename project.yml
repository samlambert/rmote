name: TV Remote
options:
  bundleIdPrefix: com.samlambert
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  ItsytvCore:
    url: https://github.com/nickustinov/itsytv-core.git
    revision: 052d9a9a0416d577119316ea813aa3b822b408e5

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

targets:
  TVRemote:
    type: application
    platform: macOS
    sources:
      - path: TVRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samlambert.appletvmenubar
        PRODUCT_NAME: TV Remote
        PRODUCT_MODULE_NAME: TVRemote
        INFOPLIST_FILE: TVRemote/Info.plist
        CODE_SIGN_ENTITLEMENTS: TVRemote/TVRemote.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: ItsytvCore
        product: ItsytvCore

  TVRemoteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TVRemoteTests
    dependencies:
      - target: TVRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TV Remote.app/Contents/MacOS/TV Remote"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  TV Remote:
    build:
      targets:
        TVRemote: all
    test:
      targets:
        - TVRemoteTests
