name: rmote
options:
  bundleIdPrefix: com.samlambert
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  ItsytvCore:
    url: https://github.com/nickustinov/itsytv-core.git
    revision: 052d9a9a0416d577119316ea813aa3b822b408e5

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

targets:
  Rmote:
    type: application
    platform: macOS
    sources:
      - path: Rmote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samlambert.rmote
        PRODUCT_NAME: rmote
        PRODUCT_MODULE_NAME: Rmote
        INFOPLIST_FILE: Rmote/Info.plist
        CODE_SIGN_ENTITLEMENTS: Rmote/Rmote.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: ItsytvCore
        product: ItsytvCore

  RmoteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RmoteTests
    dependencies:
      - target: Rmote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/rmote.app/Contents/MacOS/rmote"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  rmote:
    build:
      targets:
        Rmote: all
    test:
      targets:
        - RmoteTests
