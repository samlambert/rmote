name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap
        run: script/bootstrap
      - name: Package
        run: script/package
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          dmgs=(dist/rmote-*.dmg)
          if [ "${#dmgs[@]}" -eq 0 ]; then
            echo "No DMG found in dist/" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${dmgs[@]}" --title "$GITHUB_REF_NAME"
      - name: Upload DMG artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: rmote-dmg
          path: dist/rmote-*.dmg
